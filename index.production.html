<!doctype html>
<html lang="es">
  <head>
    <!--
      ARCHIVO TECNICO: index.production.html
      Es el "esqueleto" vacio de la pagina. El navegador abre este archivo
      primero y luego React (el codigo de App.tsx) rellena todo el contenido
      dentro del <div id="root">.

      Lo unico que conviene editar aqui son los textos de <title> y de
      <meta name="description">, porque son los que Google muestra en sus
      resultados de busqueda.
    -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="PROSESA Ingeniería — Distribuidores certificados de Motorola, Kenwood, Hikvision, Dahua. Radiocomunicación, CCTV, Control de Acceso y Telecomunicaciones en México." />
    <title>PROSESA Ingeniería — Soluciones de Comunicación y Seguridad</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
